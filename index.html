<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Snake!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e3a8a;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
      color: #0284c7;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    #game-container {
      position: relative;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.25);
      border-radius: 16px;
      overflow: hidden;
      border: 6px solid #fff;
      background-color: #f8fafc;
    }

    canvas {
      display: block;
    }

    /* Floating "Happy Birthday!" Pop-up Toast */
    #toast-message {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: #0ea5e9;
      color: white;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    #toast-message.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Final Sweet Pop-Up Modal */
    #final-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    #final-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: #fff;
      padding: 35px 30px;
      border-radius: 24px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 4px solid #7dd3fc;
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }

    #final-modal.active .card {
      transform: translateY(0);
    }

    .card h2 {
      color: #0284c7;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 24px;
    }

    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #0284c7;
      transform: scale(1.05);
    }

    .controls-hint {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #0369a1;
    }
  </style>
</head>
<body>

  <h1>🎂 Eat the Cake! 🎂</h1>

  <div id="game-container">
    <div id="toast-message">Happy Birthday! 🎉</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </div>

  <p class="controls-hint">Use <b>Arrow Keys</b> or <b>W A S D</b> to reach the cake!</p>

  <!-- Final Sweet Message Pop-Up -->
  <div id="final-modal">
    <div class="card">
      <div style="font-size: 3rem; margin-bottom: 10px;">💙🎂✨</div>
      <h2>Happy Birthday!</h2>
      <p id="sweet-message">
        <!-- Edit your personal message inside the JavaScript below! -->
      </p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ✏️ CUSTOMIZE YOUR MESSAGES & SPEED HERE
    // ==========================================
    const CAKES_TO_WIN = 1; // Only 1 cake needed!
    const SNAKE_SPEED = 240; // Higher number = slower snake (e.g., 240 is slow, 300 is very slow)
    const POPUP_TEXT = "Happy Birthday! 🎉"; // Message that pops up when the cake is touched
    const FINAL_SWEET_MESSAGE = 
      "<p> Happyyy Birthdayyyyyyy, mahh. It's not likee we always see each other, but know that you're still that friend that I wishh I could spend a time with at any day. <p>
       <p> Wishing you the sweetest birthday filled with endless laughter, love, and all your favorite things. Thank you for always being such an amazing person in my life. Here's to another wonderful year ahead! 💙 <p>";
    // ==========================================

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const toast = document.getElementById("toast-message");
    const finalModal = document.getElementById("final-modal");

    document.getElementById("sweet-message").textContent = FINAL_SWEET_MESSAGE;

    const gridSize = 25;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let dx = 1;
    let dy = 0;
    let cake = { x: 10, y: 10 };
    let score = 0;
    let gameInterval;
    let toastTimeout;
    let isGameOver = false;

    function initGame() {
      snake = [
        { x: 4, y: 8 },
        { x: 3, y: 8 },
        { x: 2, y: 8 }
      ];
      dx = 1;
      dy = 0;
      score = 0;
      isGameOver = false;
      toast.classList.remove("show");
      finalModal.classList.remove("active");
      spawnCake();

      clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, SNAKE_SPEED);
    }

    function spawnCake() {
      cake.x = Math.floor(Math.random() * tileCount);
      cake.y = Math.floor(Math.random() * tileCount);

      // Prevent cake from spawning directly on the snake
      for (let part of snake) {
        if (part.x === cake.x && part.y === cake.y) {
          spawnCake();
          break;
        }
      }
    }

    function showBirthdayPopup() {
      toast.textContent = POPUP_TEXT;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 1500);
    }

    function gameLoop() {
      if (isGameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wrap around walls so the player doesn't accidentally lose
      if (head.x < 0) head.x = tileCount - 1;
      if (head.x >= tileCount) head.x = 0;
      if (head.y < 0) head.y = tileCount - 1;
      if (head.y >= tileCount) head.y = 0;

      snake.unshift(head);

      // Check if snake touches the cake
      if (head.x === cake.x && head.y === cake.y) {
        score++;
        showBirthdayPopup();

        if (score >= CAKES_TO_WIN) {
          isGameOver = true;
          clearInterval(gameInterval);
          // Give 1.2 seconds to see
