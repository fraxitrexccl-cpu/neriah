<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Snake!</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #1e3a8a;
        overflow: hidden;
      }

      h1 {
        margin-bottom: 10px;
        font-size: 2rem;
        color: #0284c7;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
      }

      #game-container {
        position: relative;
        box-shadow: 0 12px 30px rgba(2, 132, 199, 0.25);
        border-radius: 16px;
        overflow: hidden;
        border: 6px solid #fff;
        background-color: #f8fafc;
      }

      canvas {
        display: block;
      }

      /* Floating "Happy Birthday!" Pop-up Toast */
      #toast-message {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) scale(0.8);
        background: #0ea5e9;
        color: white;
        padding: 10px 24px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        white-space: nowrap;
      }

      #toast-message.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* Final Sweet Pop-Up Modal */
      #final-modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 10;
      }

      #final-modal.active {
        opacity: 1;
        pointer-events: auto;
      }

      .card {
        background: #fff;
        padding: 35px 30px;
        border-radius: 24px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        border: 4px solid #7dd3fc;
        transform: translateY(20px);
        transition: transform 0.4s ease;
      }

      #final-modal.active .card {
        transform: translateY(0);
      }

      .card h2 {
        color: #0284c7;
        font-size: 1.8rem;
        margin-bottom: 12px;
      }

      .card p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #334155;
        margin-bottom: 24px;
      }

      button {
        background: #0ea5e9;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      button:hover {
        background: #0284c7;
        transform: scale(1.05);
      }

      .controls-hint {
        margin-top: 14px;
        font-size: 0.9rem;
        color: #0369a1;
      }
    </style>
  </head>
  <body>
    <h1>🎂 Eat the Cakes! 🎂</h1>

    <div id="game-container">
      <div id="toast-message">Happy Birthday! 🎉</div>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <p class="controls-hint">
      Use <b>Arrow Keys</b> or <b>W A S D</b> to move • Cakes eaten:
      <span id="score">0</span> / <span id="target">5</span>
    </p>

    <!-- Final Sweet Message Pop-Up -->
    <div id="final-modal">
      <div class="card">
        <div style="font-size: 3rem; margin-bottom: 10px">💙🎂✨</div>
        <h2>Happy Birthday!</h2>
        <p id="sweet-message">
          <!-- Edit your personal message inside the JavaScript below! -->
        </p>
        <button onclick="resetGame()">Play Again</button>
      </div>
    </div>

    <script>
      // ==========================================
      // ✏️ CUSTOMIZE YOUR MESSAGES & SETTINGS HERE
      // ==========================================
      const CAKES_TO_WIN = 5; // Number of cakes before the final sweet message pops up
      const POPUP_TEXT = "Happy Birthday! 🎉"; // Message that pops up every time a cake is touched
      const FINAL_SWEET_MESSAGE =
        "Wishing you the sweetest birthday filled with endless laughter, love, and all your favorite things. Thank you for always being such an amazing person in my life. Here's to another wonderful year ahead! 💙";
      // ==========================================

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const toast = document.getElementById("toast-message");
      const finalModal = document.getElementById("final-modal");
      const scoreEl = document.getElementById("score");
      const targetEl = document.getElementById("target");

      document.getElementById("sweet-message").textContent =
        FINAL_SWEET_MESSAGE;
      targetEl.textContent = CAKES_TO_WIN;

      const gridSize = 25;
      const tileCount = canvas.width / gridSize;

      let snake = [];
      let dx = 1;
      let dy = 0;
      let cake = { x: 10, y: 10 };
      let score = 0;
      let gameInterval;
      let toastTimeout;
      let isGameOver = false;

      function initGame() {
        snake = [
          { x: 5, y: 8 },
          { x: 4, y: 8 },
          { x: 3, y: 8 },
        ];
        dx = 1;
        dy = 0;
        score = 0;
        isGameOver = false;
        scoreEl.textContent = score;
        finalModal.classList.remove("active");
        spawnCake();

        clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 140); // Snake speed (lower = faster)
      }

      function spawnCake() {
        cake.x = Math.floor(Math.random() * tileCount);
        cake.y = Math.floor(Math.random() * tileCount);

        // Prevent cake from spawning directly on the snake
        for (let part of snake) {
          if (part.x === cake.x && part.y === cake.y) {
            spawnCake();
            break;
          }
        }
      }

      function showBirthdayPopup() {
        toast.textContent = POPUP_TEXT;
        toast.classList.add("show");
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove("show");
        }, 1100);
      }

      function gameLoop() {
        if (isGameOver) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Wrap around walls so the player doesn't accidentally lose
        if (head.x < 0) head.x = tileCount - 1;
        if (head.x >= tileCount) head.x = 0;
        if (head.y < 0) head.y = tileCount - 1;
        if (head.y >= tileCount) head.y = 0;

        snake.unshift(head);

        // Check if snake touches the cake
        if (head.x === cake.x && head.y === cake.y) {
          score++;
          scoreEl.textContent = score;
          showBirthdayPopup();

          if (score >= CAKES_TO_WIN) {
            isGameOver = true;
            clearInterval(gameInterval);
            setTimeout(() => {
              finalModal.classList.add("active");
            }, 500);
          } else {
            spawnCake();
          }
        } else {
          snake.pop();
        }

        drawGame();
      }

      function drawGame() {
        // Clear background with subtle blue grid
        ctx.fillStyle = "#f0f9ff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#e0f2fe";
        for (let i = 0; i < canvas.width; i += gridSize) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(canvas.width, i);
          ctx.stroke();
        }

        // Draw Cake Emoji 🎂
        ctx.font = `${gridSize - 2}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
          "🎂",
          cake.x * gridSize + gridSize / 2,
          cake.y * gridSize + gridSize / 2 + 2,
        );

        // Draw Blue Snake
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#0284c7" : "#38bdf8";
          ctx.beginPath();
          ctx.roundRect(
            part.x * gridSize + 2,
            part.y * gridSize + 2,
            gridSize - 4,
            gridSize - 4,
            8,
          );
          ctx.fill();
        });
      }

      function resetGame() {
        initGame();
      }

      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if ((key === "arrowup" || key === "w") && dy !== 1) {
          dx = 0;
          dy = -1;
        } else if ((key === "arrowdown" || key === "s") && dy !== -1) {
          dx = 0;
          dy = 1;
        } else if ((key === "arrowleft" || key === "a") && dx !== 1) {
          dx = -1;
          dy = 0;
        } else if ((key === "arrowright" || key === "d") && dx !== -1) {
          dx = 1;
          dy = 0;
        }
      });

      initGame();
    </script>
  </body>
</html>
